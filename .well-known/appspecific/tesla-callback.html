<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Helios Tesla callback</title>
  </head>
  <body style="font-family: system-ui, sans-serif; background: #0b0d10; color: #e8eaed; padding: 2rem">
    <p>Returning to Helios…</p>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var state = params.get("state") || "";
        var dot = state.indexOf(".");
        if (dot < 1) {
          document.body.textContent =
            "Missing Helios return address. Start Grant Tesla account access from Helios again.";
          return;
        }
        var origin;
        try {
          origin = decodeURIComponent(state.slice(dot + 1));
          var u = new URL(origin);
          if (u.protocol !== "https:" && u.hostname !== "localhost" && u.hostname !== "127.0.0.1") {
            throw new Error("insecure");
          }
          location.replace(u.origin + "/api/tesla/callback" + location.search);
        } catch (e) {
          document.body.textContent = "Invalid Helios return address.";
        }
      })();
    </script>
  </body>
</html>
